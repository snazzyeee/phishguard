<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="PhishGuard circular queue email threat assessment demo.">
  <title>PhishGuard</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>PhishGuard</h1>
      <p>Circular queue email threat assessment</p>
      <p class="queue-count">Pending emails: <strong id="pending-count">0</strong> / 10</p>
    </header>

    <form id="receive-form" novalidate>
      <h2>1. Receive email (enqueue)</h2>
      <label for="sender">Sender address</label>
      <input id="sender" name="sender" maxlength="49" autocomplete="off" required>
      <label for="subject">Subject</label>
      <input id="subject" name="subject" maxlength="99" autocomplete="off">
      <label for="body">Message body</label>
      <textarea id="body" name="body" maxlength="199" rows="4"></textarea>
      <button class="primary" type="submit">Receive email</button>
    </form>

    <section aria-labelledby="operations-title">
      <h2 id="operations-title">Other operations</h2>
      <div id="operations" class="operations">
        <button type="button" data-choice="2">2. Assess next</button>
        <button type="button" data-choice="3">3. Peek next</button>
        <button type="button" data-choice="4">4. Display pending</button>
        <button type="button" data-choice="5">5. Assess all</button>
        <button type="button" data-choice="6">6. Session summary</button>
        <button type="button" data-choice="0">0. Exit</button>
      </div>
    </section>

    <section aria-labelledby="output-title">
      <h2 id="output-title">Program output</h2>
      <pre id="output" role="log" aria-live="polite" aria-relevant="additions"></pre>
    </section>

    <p class="source-link"><a href="source/phishguard.c">View the C source from the project PDF</a></p>
  </main>
</body>
</html>
